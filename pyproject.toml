[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence pipeline: messy contracts in, validated JSON out — parsed, extracted, evaluated, served."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pillow>=13.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=7.0.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "pytz>=2024.1",
    "rapidfuzz>=3.14.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54",
]

[project.scripts]
docintel = "docintel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.28",
]
# Phase 3 parser comparison only (D6 keeps Docling out of production). Pulls in torch, so
# it's opt-in: `uv sync --group research`. Keeps CI and the Docker image small.
research = [
    "docling[rapidocr]>=2.150.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle basics, I = import sorting, B = bugbear (likely bugs), UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
