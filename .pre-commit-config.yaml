repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]  # stops accidental commits of PDFs / DuckDB files
      - id: end-of-file-fixer
        exclude: ^(evalsets/snapshot/|web/public/data/)  # generated/verbatim: never rewrite
      - id: trailing-whitespace
        exclude: ^(evalsets/snapshot/|web/public/data/)
